name: Keep Render Backend Active (24/7)

on:
  schedule:
    # Runs every 10 minutes to prevent Render free tier from sleeping
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          echo "Pinging Render backend health check..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://video-editor-backend-uqxp.onrender.com/api/health)
          echo "Backend returned HTTP $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Warning: Health check returned status $HTTP_STATUS"
          fi
