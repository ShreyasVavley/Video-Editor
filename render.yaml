services:
  - type: web
    name: video-editor-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PROJECT_NAME
        value: "Cloud-Native Video Editor"
      - key: SECRET_KEY
        generateValue: true
      - key: MAX_UPLOAD_SIZE_MB
        value: "1024"
