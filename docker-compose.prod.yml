version: '3.8'

services:
  # Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: video_editor_postgres_prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-editor_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeThisStrongPassword123!}
      POSTGRES_DB: ${POSTGRES_DB:-video_editor_prod}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-editor_user} -d ${POSTGRES_DB:-video_editor_prod}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Message Broker & Cache
  redis:
    image: redis:7-alpine
    container_name: video_editor_redis_prod
    command: redis-server --appendonly yes
    volumes:
      - redis_data_prod:/data
    restart: always

  # Backend API & FFmpeg Core
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: video_editor_backend_prod
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-editor_user}:${POSTGRES_PASSWORD:-ChangeThisStrongPassword123!}@postgres:5432/${POSTGRES_DB:-video_editor_prod}
      SECRET_KEY: ${SECRET_KEY:-f78a2e1d094b8c6a2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e}
      REDIS_URL: redis://redis:6379/0
      PROJECT_NAME: "Cloud-Native Video Editor"
    volumes:
      - media_storage_prod:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always

  # Frontend Next.js Standalone
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: video_editor_frontend_prod
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    restart: always

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: video_editor_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - media_storage_prod:/media:ro
      - certs_data:/etc/letsencrypt
    depends_on:
      - backend
      - frontend
    restart: always

volumes:
  postgres_data_prod:
  redis_data_prod:
  media_storage_prod:
  certs_data:
